name: ci

on:
  push:
  pull_request:

jobs:
  simulation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys gcc-riscv64-unknown-elf
          pip install "cocotb>=2.0,<3"
      - name: Lint
        run: make lint
      - name: riscv-tests RV32UI (both cores)
        run: make isa
      - name: Random lockstep test (both cores)
        run: make random
      - name: FPGA top level simulation
        run: make fpga-sim
      - name: Synthesis estimate
        run: make synth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            tb/coverage_*.txt
            tb/results.xml
            build/synth_riscv_*.txt

  riscv-formal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: YosysHQ/setup-oss-cad-suite@v3
      - name: riscv-formal
        run: make formal
