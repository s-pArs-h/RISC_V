# riscv-formal configuration for the 5-stage pipelined core (riscv_pipeline).
# Run with formal/run.sh pipeline
# Depths are larger than for the single-cycle core: an instruction needs five
# cycles to retire, and the reg/pc checks need several in flight.

[options]
isa rv32i
solver yices

[depth]
insn            12
reg        8    20
pc_fwd     8    20
pc_bwd     8    20
unique     1  8 20
causal     8    20
ill             12
cover      1    20

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_CORE riscv_pipeline

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
@basedir@/cores/@core@/riscv_decoder.sv
@basedir@/cores/@core@/riscv_imm_gen.sv
@basedir@/cores/@core@/riscv_alu.sv
@basedir@/cores/@core@/riscv_regfile.sv
@basedir@/cores/@core@/riscv_lsu.sv
@basedir@/cores/@core@/riscv_pipeline.sv

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 4);
