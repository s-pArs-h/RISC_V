# riscv-formal configuration for the single-cycle core (riscv_core).
# Run with formal/run.sh single

[options]
isa rv32i
solver yices

[depth]
insn            4
reg        2    6
pc_fwd     2    6
pc_bwd     2    6
unique     1  2 6
causal     2    6
ill             4
cover      1    6

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_CORE riscv_core

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
@basedir@/cores/@core@/riscv_decoder.sv
@basedir@/cores/@core@/riscv_imm_gen.sv
@basedir@/cores/@core@/riscv_alu.sv
@basedir@/cores/@core@/riscv_regfile.sv
@basedir@/cores/@core@/riscv_lsu.sv
@basedir@/cores/@core@/riscv_core.sv

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 4);
